# Auto-deploy to Cloudflare on every push to main: run the whole test suite,
# build the static app into dist/, then deploy the single Worker that serves
# both the app and the /api (see server/wrangler.toml). This replaces GitHub
# Pages, so the repository can be private.
#
# One-time setup (repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   an API token made from the "Edit Cloudflare
#                          Workers" template (dash.cloudflare.com -> profile
#                          -> API Tokens)
#   CLOUDFLARE_ACCOUNT_ID  the account id shown on the Workers overview page
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the test suite
        run: npm test

      - name: Build the app bundle
        run: ./scripts/build-app.sh

      - name: Deploy Worker (app + API)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
