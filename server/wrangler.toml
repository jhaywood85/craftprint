# Cloudflare Worker config for CraftPrint: ONE Worker serves both the app
# (static assets from ../dist, built by scripts/build-app.sh) and the
# Classroom/accounts API (worker.js handles /api/*).
#
# Deploys happen automatically from GitHub Actions on every push to main
# (.github/workflows/deploy.yml). To deploy by hand instead:
#   ./scripts/build-app.sh && cd server && npx wrangler deploy
name = "craftprint-class"
main = "worker.js"
compatibility_date = "2026-01-01"

# The app's static files. Requests that match a file here are served
# directly; everything else (i.e. /api/*) falls through to worker.js.
[assets]
directory = "../dist"

# Created by:  npx wrangler kv namespace create ROOMS
[[kv_namespaces]]
binding = "ROOMS"
id = "0973529cb60547d6bc2de856e7155f7b"
